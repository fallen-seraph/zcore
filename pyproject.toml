[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ZCore"
version = "2.0.0"
authors = [
  { name="Fallen Seraph", email="fallenseriphan@gmail.com" },
]
description = "Project Zomboid automation wrapper for lgsm"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/fallen-seraph/zcore"
Issues = "https://github.com/fallen-seraph/zcore/issues"